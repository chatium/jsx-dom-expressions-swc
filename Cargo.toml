[package]
name = "jsx-dom-expressions"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "jsx_dom_expressions"

[dependencies]
htmlize = { version = "1", default-features = false, features = ["unescape"] }
swc_core = { version = "=80.0.0", features = [
  "ecma_ast",
  "ecma_visit",
  "ecma_utils",
  "common",
] }

[dev-dependencies]
serde_json = "1"
# The extra transform features are only for examples/corpus-compare.rs, which reproduces
# the lowering a host compiler does before the JSX pass runs.
swc_core = { version = "=80.0.0", features = [
  "ecma_ast",
  "ecma_visit",
  "ecma_utils",
  "ecma_codegen",
  "ecma_parser",
  "ecma_parser_typescript",
  "ecma_transforms",
  "ecma_transforms_typescript",
  "ecma_transforms_proposal",
  "ecma_helpers_inline",
  "common",
] }
